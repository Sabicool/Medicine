<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1000" height="640" fill="#ffffff"/>
  <defs>
    <marker id="arrDn" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#5c6a78"/>
    </marker>
  </defs>

  <text x="30" y="38" font-size="21" font-weight="700" fill="#14202b">Four mechanisms that raise intra-abdominal pressure</text>
  <text x="30" y="60" font-size="13" fill="#5c6a78">Learn the mechanism, not the list — every risk factor sits in one of these four buckets</text>

  <!-- Box 1 -->
  <rect x="30" y="88" width="220" height="296" rx="8" fill="#ffffff" stroke="#2f8f8a" stroke-width="1.6"/>
  <path d="M 30 96 a 8 8 0 0 1 8 -8 h 204 a 8 8 0 0 1 8 8 v 44 h -220 z" fill="#2f8f8a"/>
  <text x="140" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">↓ Abdominal wall</text>
  <text x="140" y="128" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">compliance</text>
  <g font-size="12.5" fill="#14202b">
    <text x="46" y="168">• Tense fascial closure</text>
    <text x="46" y="194">• Abdominal wall burns, eschar</text>
    <text x="46" y="220">• Prone positioning</text>
    <text x="46" y="246">• Head-up &gt; 30°</text>
    <text x="46" y="272">• High BMI, central obesity</text>
    <text x="46" y="298">• High intrathoracic pressure</text>
    <text x="46" y="324">• Pain, agitation, muscle tone</text>
  </g>
  <text x="46" y="360" font-size="11" fill="#2f8f8a" font-style="italic">The box gets stiffer</text>

  <!-- Box 2 -->
  <rect x="270" y="88" width="220" height="296" rx="8" fill="#ffffff" stroke="#2b6ca3" stroke-width="1.6"/>
  <path d="M 270 96 a 8 8 0 0 1 8 -8 h 204 a 8 8 0 0 1 8 8 v 44 h -220 z" fill="#2b6ca3"/>
  <text x="380" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">↑ Intraluminal</text>
  <text x="380" y="128" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">contents</text>
  <g font-size="12.5" fill="#14202b">
    <text x="286" y="168">• Gastroparesis</text>
    <text x="286" y="194">• Ileus</text>
    <text x="286" y="220">• Colonic pseudo-obstruction</text>
    <text x="286" y="246">• Bowel obstruction</text>
    <text x="286" y="272">• Toxic megacolon</text>
    <text x="286" y="298">• Constipation, faecal loading</text>
    <text x="286" y="324">• Overzealous enteral feed</text>
  </g>
  <text x="286" y="360" font-size="11" fill="#2b6ca3" font-style="italic">Gut fills up — decompressible</text>

  <!-- Box 3 -->
  <rect x="510" y="88" width="220" height="296" rx="8" fill="#ffffff" stroke="#97527e" stroke-width="1.6"/>
  <path d="M 510 96 a 8 8 0 0 1 8 -8 h 204 a 8 8 0 0 1 8 8 v 44 h -220 z" fill="#97527e"/>
  <text x="620" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">↑ Intra-abdominal</text>
  <text x="620" y="128" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">contents</text>
  <g font-size="12.5" fill="#14202b">
    <text x="526" y="168">• Ascites</text>
    <text x="526" y="194">• Haemo-/pneumoperitoneum</text>
    <text x="526" y="220">• Intra-abdominal collection</text>
    <text x="526" y="246">• Retroperitoneal haematoma</text>
    <text x="526" y="272">• Tumour, gravid uterus</text>
    <text x="526" y="298">• Liver dysfunction</text>
    <text x="526" y="324">• Surgical packs</text>
  </g>
  <text x="526" y="360" font-size="11" fill="#97527e" font-style="italic">Space-occupying — drainable</text>

  <!-- Box 4 -->
  <rect x="750" y="88" width="220" height="296" rx="8" fill="#ffffff" stroke="#c14a3f" stroke-width="1.6"/>
  <path d="M 750 96 a 8 8 0 0 1 8 -8 h 204 a 8 8 0 0 1 8 8 v 44 h -220 z" fill="#c14a3f"/>
  <text x="860" y="110" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Capillary leak +</text>
  <text x="860" y="128" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">fluid resuscitation</text>
  <g font-size="12.5" fill="#14202b">
    <text x="766" y="168">• Massive fluid resuscitation</text>
    <text x="766" y="194">• Transfusion &gt; 10 U / 24 h</text>
    <text x="766" y="220">• Sepsis, pancreatitis</text>
    <text x="766" y="246">• Major burns</text>
    <text x="766" y="272">• Acidosis pH &lt; 7.2</text>
    <text x="766" y="298">• Hypothermia &lt; 33 °C</text>
    <text x="766" y="324">• Coagulopathy, hypotension</text>
  </g>
  <text x="766" y="360" font-size="11" fill="#c14a3f" font-style="italic">Bowel and mesentery swell</text>

  <!-- Convergence rail -->
  <g stroke="#5c6a78" stroke-width="1.8" fill="none">
    <path d="M 140 384 L 140 420"/>
    <path d="M 380 384 L 380 420"/>
    <path d="M 620 384 L 620 420"/>
    <path d="M 860 384 L 860 420"/>
    <path d="M 140 420 L 860 420"/>
    <path d="M 500 420 L 500 452" marker-end="url(#arrDn)"/>
  </g>

  <rect x="300" y="462" width="400" height="52" rx="26" fill="#c14a3f"/>
  <text x="500" y="494" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">↑ INTRA-ABDOMINAL PRESSURE</text>

  <path d="M 500 514 L 500 542" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#arrDn)"/>

  <rect x="180" y="552" width="640" height="60" rx="8" fill="#eef4f9" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="500" y="578" font-size="14" font-weight="700" fill="#2b6ca3" text-anchor="middle">≥ 2 risk factors, or any new / progressive organ failure</text>
  <text x="500" y="599" font-size="13" fill="#14202b" text-anchor="middle">→ measure the bladder pressure, 4-hourly, and trend it</text>
</svg>

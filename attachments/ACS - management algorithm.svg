<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 730" width="1060" height="730" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="1060" height="730" fill="#ffffff"/>
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#5c6a78"/></marker>
  </defs>

  <text x="30" y="34" font-size="21" font-weight="700" fill="#14202b">From risk factor to laparotomy — the decision path</text>
  <text x="30" y="56" font-size="13" fill="#5c6a78">Every downward step requires a fresh IAP measurement. The diagnosis is made by trend, not by one number.</text>

  <!-- 1 -->
  <rect x="160" y="66" width="340" height="48" rx="7" fill="#eef4f9" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="330" y="95" font-size="12.5" fill="#14202b" text-anchor="middle">≥ 2 risk factors, or new organ failure</text>
  <path d="M 330 114 L 330 130" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>

  <!-- 2 -->
  <rect x="160" y="132" width="340" height="48" rx="7" fill="#eef4f9" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="330" y="161" font-size="12.5" fill="#14202b" text-anchor="middle">Measure IAP — trans-bladder, 4-hourly (1C)</text>
  <path d="M 330 180 L 330 196" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>

  <!-- D1 -->
  <path d="M 178 198 L 482 198 L 500 226 L 482 254 L 178 254 L 160 226 Z" fill="#f5f2e8" stroke="#b58b2a" stroke-width="1.6"/>
  <text x="330" y="231" font-size="13" font-weight="700" fill="#14202b" text-anchor="middle">IAP ≥ 12 mmHg?</text>
  <path d="M 500 226 L 594 226" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="547" y="219" font-size="11" font-weight="700" fill="#5c6a78" text-anchor="middle">no</text>
  <rect x="600" y="202" width="420" height="48" rx="7" fill="#ffffff" stroke="#ccd5dd" stroke-width="1.6"/>
  <text x="620" y="231" font-size="12" fill="#5c6a78">Not IAH — re-measure if the clinical picture changes</text>
  <path d="M 330 254 L 330 272" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="344" y="268" font-size="11" font-weight="700" fill="#5c6a78">yes</text>

  <!-- 3 -->
  <rect x="160" y="274" width="340" height="62" rx="7" fill="#f0f5e9" stroke="#7aa95c" stroke-width="2"/>
  <text x="330" y="297" font-size="13" font-weight="700" fill="#4f7a33" text-anchor="middle">INTRA-ABDOMINAL HYPERTENSION</text>
  <text x="330" y="317" font-size="11.5" fill="#14202b" text-anchor="middle">start the five medical measures</text>
  <path d="M 330 336 L 330 352" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>

  <!-- D2 -->
  <path d="M 178 354 L 482 354 L 500 385 L 482 416 L 178 416 L 160 385 Z" fill="#f5f2e8" stroke="#b58b2a" stroke-width="1.6"/>
  <text x="330" y="380" font-size="13" font-weight="700" fill="#14202b" text-anchor="middle">IAP &gt; 20 mmHg with</text>
  <text x="330" y="399" font-size="13" font-weight="700" fill="#14202b" text-anchor="middle">new organ dysfunction?</text>
  <path d="M 500 385 L 594 385" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="547" y="378" font-size="11" font-weight="700" fill="#5c6a78" text-anchor="middle">no</text>
  <rect x="600" y="361" width="420" height="48" rx="7" fill="#ffffff" stroke="#ccd5dd" stroke-width="1.6"/>
  <text x="620" y="390" font-size="12" fill="#5c6a78">Continue the five measures; keep trending the IAP</text>
  <path d="M 330 416 L 330 434" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="344" y="430" font-size="11" font-weight="700" fill="#5c6a78">yes</text>

  <!-- 4 -->
  <rect x="160" y="436" width="340" height="62" rx="7" fill="#fdf0ee" stroke="#c14a3f" stroke-width="2"/>
  <text x="330" y="459" font-size="13" font-weight="700" fill="#a81f18" text-anchor="middle">ABDOMINAL COMPARTMENT SYNDROME</text>
  <text x="330" y="479" font-size="11.5" fill="#14202b" text-anchor="middle">maximise every medical measure</text>
  <path d="M 330 498 L 330 514" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>

  <!-- D3 -->
  <path d="M 178 516 L 482 516 L 500 544 L 482 572 L 178 572 L 160 544 Z" fill="#f5f2e8" stroke="#b58b2a" stroke-width="1.6"/>
  <text x="330" y="549" font-size="13" font-weight="700" fill="#14202b" text-anchor="middle">Refractory to medical management?</text>
  <path d="M 500 544 L 594 544" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="547" y="537" font-size="11" font-weight="700" fill="#5c6a78" text-anchor="middle">no</text>
  <rect x="600" y="520" width="420" height="48" rx="7" fill="#ffffff" stroke="#ccd5dd" stroke-width="1.6"/>
  <text x="620" y="549" font-size="12" fill="#5c6a78">Continue and keep watching — it can still declare</text>
  <path d="M 330 572 L 330 592" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <text x="344" y="588" font-size="11" font-weight="700" fill="#5c6a78">yes</text>

  <!-- 5 -->
  <rect x="160" y="594" width="340" height="54" rx="7" fill="#c14a3f"/>
  <text x="330" y="626" font-size="14.5" font-weight="700" fill="#ffffff" text-anchor="middle">DECOMPRESSIVE LAPAROTOMY (1D)</text>
  <path d="M 500 621 L 594 621" stroke="#5c6a78" stroke-width="1.8" fill="none" marker-end="url(#am)"/>
  <rect x="600" y="590" width="420" height="62" rx="7" fill="#fdf0ee" stroke="#c14a3f" stroke-width="1.6"/>
  <text x="620" y="614" font-size="11.5" fill="#14202b">Open abdomen → NPWT (1C), early fascial closure (1D)</text>
  <text x="620" y="634" font-size="11.5" font-weight="700" fill="#a81f18">Recurrent ACS still possible — laparostomy is not protective</text>

  <text x="30" y="686" font-size="11.5" fill="#5c6a78">WSACS 2013 recommends protocolised monitoring and management over ad hoc care (1C) — the protocol matters more than any single decision on it.</text>
  <text x="30" y="706" font-size="11.5" fill="#5c6a78">Percutaneous drainage first (2C) may avert laparotomy altogether (2D) where there is drainable free fluid — always ask before you commit to opening.</text>
</svg>

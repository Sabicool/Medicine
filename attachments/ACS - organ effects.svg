<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 680" width="900" height="680" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="900" height="680" fill="#ffffff"/>
  <defs>
    <marker id="mCns" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#6a4c93"/></marker>
    <marker id="mResp" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#2f8f8a"/></marker>
    <marker id="mCv" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#c14a3f"/></marker>
    <marker id="mRen" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#2b6ca3"/></marker>
    <marker id="mSpl" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#97527e"/></marker>
    <marker id="mLim" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M 0 0.5 L 8 4.5 L 0 8.5 z" fill="#8a6817"/></marker>
  </defs>

  <text x="24" y="32" font-size="21" font-weight="700" fill="#14202b">Organ dysfunction attributable to raised intra-abdominal pressure</text>
  <text x="24" y="54" font-size="13" fill="#5c6a78">This is the second half of the ACS definition — the pressure alone is only IAH</text>

  <!-- Body -->
  <circle cx="450" cy="92" r="34" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="438" y="122" width="24" height="18" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="404" y="136" width="92" height="156" rx="22" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="384" y="148" width="16" height="140" rx="8" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="500" y="148" width="16" height="140" rx="8" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="418" y="348" width="22" height="210" rx="11" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <rect x="460" y="348" width="22" height="210" rx="11" fill="#f4f7fa" stroke="#5c6a78" stroke-width="2"/>
  <ellipse cx="450" cy="300" rx="64" ry="54" fill="#fdf0ee" stroke="#c14a3f" stroke-width="3.5"/>
  <text x="450" y="306" font-size="16" font-weight="700" fill="#c14a3f" text-anchor="middle">↑ IAP</text>

  <!-- Neurological -->
  <rect x="24" y="70" width="250" height="76" rx="7" fill="#ffffff" stroke="#6a4c93" stroke-width="1.6"/>
  <text x="40" y="92" font-size="13" font-weight="700" fill="#6a4c93">Neurological</text>
  <text x="40" y="114" font-size="12" fill="#14202b">↑ CVP → impaired cerebral</text>
  <text x="40" y="132" font-size="12" fill="#14202b">venous drainage → ↑ ICP, delirium</text>
  <path d="M 278 108 L 412 94" fill="none" stroke="#6a4c93" stroke-width="1.8" marker-end="url(#mCns)"/>

  <!-- Respiratory -->
  <rect x="626" y="140" width="250" height="96" rx="7" fill="#ffffff" stroke="#2f8f8a" stroke-width="1.6"/>
  <text x="642" y="162" font-size="13" font-weight="700" fill="#2f8f8a">Respiratory</text>
  <text x="642" y="184" font-size="12" fill="#14202b">↓ chest wall compliance</text>
  <text x="642" y="202" font-size="12" fill="#14202b">↑ peak and plateau pressures</text>
  <text x="642" y="220" font-size="12" fill="#14202b">↓ tidal volume, hypercapnia</text>
  <path d="M 622 188 L 520 190" fill="none" stroke="#2f8f8a" stroke-width="1.8" marker-end="url(#mResp)"/>

  <!-- Cardiovascular -->
  <rect x="24" y="230" width="250" height="112" rx="7" fill="#ffffff" stroke="#c14a3f" stroke-width="1.6"/>
  <text x="40" y="252" font-size="13" font-weight="700" fill="#c14a3f">Cardiovascular</text>
  <text x="40" y="274" font-size="12" fill="#14202b">↓ venous return → ↓ cardiac output</text>
  <text x="40" y="292" font-size="12" fill="#14202b">BP preserved early (↑ SVR)</text>
  <text x="40" y="310" font-size="12" fill="#14202b" font-weight="700">CVP and PAOP falsely HIGH</text>
  <text x="40" y="328" font-size="12" fill="#14202b">IVC collapsed, yet volume-depleted</text>
  <path d="M 278 286 L 380 242" fill="none" stroke="#c14a3f" stroke-width="1.8" marker-end="url(#mCv)"/>

  <!-- Renal -->
  <rect x="626" y="296" width="250" height="96" rx="7" fill="#ffffff" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="642" y="318" font-size="13" font-weight="700" fill="#2b6ca3">Renal — usually first</text>
  <text x="642" y="340" font-size="12" fill="#14202b">Oliguria → anuria</text>
  <text x="642" y="358" font-size="12" fill="#14202b">Renal vein + tubular compression</text>
  <text x="642" y="376" font-size="12" fill="#14202b">Good urine output makes ACS unlikely</text>
  <path d="M 622 344 L 518 302" fill="none" stroke="#2b6ca3" stroke-width="1.8" marker-end="url(#mRen)"/>

  <!-- Splanchnic -->
  <rect x="24" y="404" width="250" height="92" rx="7" fill="#ffffff" stroke="#97527e" stroke-width="1.6"/>
  <text x="40" y="426" font-size="13" font-weight="700" fill="#97527e">Splanchnic</text>
  <text x="40" y="448" font-size="12" fill="#14202b">Mucosal hypoperfusion, bowel oedema</text>
  <text x="40" y="466" font-size="12" fill="#14202b">Bacterial translocation (IAP &gt; 35)</text>
  <text x="40" y="484" font-size="12" fill="#14202b">↓ portal flow, ↓ hepatic clearance</text>
  <path d="M 278 448 L 386 326" fill="none" stroke="#97527e" stroke-width="1.8" marker-end="url(#mSpl)"/>

  <!-- Lower limb -->
  <rect x="626" y="452" width="250" height="72" rx="7" fill="#ffffff" stroke="#8a6817" stroke-width="1.6"/>
  <text x="642" y="474" font-size="13" font-weight="700" fill="#8a6817">Lower limb</text>
  <text x="642" y="496" font-size="12" fill="#14202b">Femoral venous stasis</text>
  <text x="642" y="514" font-size="12" fill="#14202b">↑ DVT risk, limb oedema</text>
  <path d="M 622 488 L 488 462" fill="none" stroke="#8a6817" stroke-width="1.8" marker-end="url(#mLim)"/>

  <!-- Footer -->
  <rect x="24" y="596" width="852" height="64" rx="8" fill="#eef4f9" stroke="#2b6ca3" stroke-width="1.6"/>
  <text x="42" y="622" font-size="12.5" fill="#14202b">Which organ declares first depends on which was closest to the edge — COPD presents respiratory, CKD presents renal.</text>
  <text x="42" y="644" font-size="12.5" font-weight="700" fill="#a81f18">The trap: filling pressures read falsely high while the patient is volume-depleted — pushing you toward fluid, which raises IAP.</text>
</svg>

        <path id="epiglottis" d="M 0,1.6 C -8.8,1.6 -9.8,3.8 -9.8,6 C -9.8,19.2 -5.6,21.8 0,21.8 C 5.6,21.8 9.8,19.2 9.8,6 C 9.8,3.8 8.8,1.6 0,1.6 Z" style="fill:#f3dfe3;stroke:#15203b;stroke-width:0.28" />

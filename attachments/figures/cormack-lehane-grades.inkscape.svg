              style="fill:#f3dfe3;stroke:#15203b;stroke-width:0.14" />
        <path d="M 6.6,8.5 C 8.4,13 8.2,17.5 6.6,21.4 L 3.2,21.4 C 4.6,17 4.6,12.5 3.4,8.6 Z"
              style="fill:#f3dfe3;stroke:#15203b;stroke-width:0.14" />
        <!-- glottic aperture -->
        <path id="glottis" d="M 0,7.2 L 3.5,19.6 C 2.2,21.4 -2.2,21.4 -3.5,19.6 Z"

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
  <rect width="900" height="330" fill="#ffffff"/>

  <text x="70" y="38" font-size="21" font-weight="700" fill="#14202b">Grading intra-abdominal hypertension</text>
  <text x="70" y="60" font-size="13" fill="#5c6a78">WSACS 2013 consensus definitions (Kirkpatrick et al, Intensive Care Med 2013;39:1190–1206)</text>

  <!-- ACS callout -->
  <line x1="570" y1="96" x2="570" y2="236" stroke="#a81f18" stroke-width="2" stroke-dasharray="5 4"/>
  <rect x="396" y="80" width="348" height="50" rx="6" fill="#fdf0ee" stroke="#a81f18" stroke-width="1.5"/>
  <text x="570" y="100" font-size="13" font-weight="700" fill="#a81f18" text-anchor="middle">ACS = sustained IAP &gt; 20 mmHg</text>
  <text x="570" y="119" font-size="12" fill="#8c2a24" text-anchor="middle">PLUS new organ dysfunction attributable to it</text>

  <text x="220" y="160" font-size="10.5" fill="#5c6a78" text-anchor="middle">5–7</text>
  <line x1="220" y1="164" x2="220" y2="170" stroke="#5c6a78" stroke-width="1"/>

  <!-- Bar segments -->
  <rect x="70"  y="170" width="300" height="52" fill="#3f8f6f"/>
  <rect x="195" y="170" width="50"  height="52" fill="#2e7358"/>
  <rect x="370" y="170" width="100" height="52" fill="#7aa95c"/>
  <rect x="470" y="170" width="125" height="52" fill="#dfa92e"/>
  <rect x="595" y="170" width="125" height="52" fill="#d97c33"/>
  <rect x="720" y="170" width="150" height="52" fill="#c14a3f"/>
  <rect x="70"  y="170" width="800" height="52" fill="none" stroke="#ffffff" stroke-width="0"/>
  <line x1="370" y1="170" x2="370" y2="222" stroke="#ffffff" stroke-width="2"/>
  <line x1="470" y1="170" x2="470" y2="222" stroke="#ffffff" stroke-width="2"/>
  <line x1="595" y1="170" x2="595" y2="222" stroke="#ffffff" stroke-width="2"/>
  <line x1="720" y1="170" x2="720" y2="222" stroke="#ffffff" stroke-width="2"/>

  <text x="305" y="192" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Normal</text>
  <text x="305" y="209" font-size="11.5" fill="#e4f2ec" text-anchor="middle">0–11</text>
  <text x="420" y="192" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Grade I</text>
  <text x="420" y="209" font-size="11.5" fill="#f0f5e9" text-anchor="middle">12–15</text>
  <text x="532" y="192" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Grade II</text>
  <text x="532" y="209" font-size="11.5" fill="#fdf5e3" text-anchor="middle">16–20</text>
  <text x="657" y="192" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Grade III</text>
  <text x="657" y="209" font-size="11.5" fill="#fdefe3" text-anchor="middle">21–25</text>
  <text x="795" y="192" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">Grade IV</text>
  <text x="795" y="209" font-size="11.5" fill="#fdeceb" text-anchor="middle">&gt; 25</text>

  <!-- IAH bracket -->
  <path d="M 370 232 L 370 240 L 870 240 L 870 232" fill="none" stroke="#5c6a78" stroke-width="1.2"/>
  <rect x="530" y="231" width="180" height="18" fill="#ffffff"/>
  <text x="620" y="245" font-size="11.5" font-weight="600" fill="#14202b" text-anchor="middle">IAH: sustained IAP ≥ 12 mmHg</text>

  <!-- Axis -->
  <line x1="70" y1="262" x2="870" y2="262" stroke="#ccd5dd" stroke-width="1.2"/>
  <g stroke="#ccd5dd" stroke-width="1.2">
    <line x1="70"  y1="262" x2="70"  y2="268"/>
    <line x1="195" y1="262" x2="195" y2="268"/>
    <line x1="320" y1="262" x2="320" y2="268"/>
    <line x1="445" y1="262" x2="445" y2="268"/>
    <line x1="570" y1="262" x2="570" y2="268"/>
    <line x1="695" y1="262" x2="695" y2="268"/>
    <line x1="820" y1="262" x2="820" y2="268"/>
  </g>
  <g font-size="10.5" fill="#5c6a78" text-anchor="middle">
    <text x="70"  y="281">0</text>
    <text x="195" y="281">5</text>
    <text x="320" y="281">10</text>
    <text x="445" y="281">15</text>
    <text x="570" y="281">20</text>
    <text x="695" y="281">25</text>
    <text x="820" y="281">30</text>
  </g>
  <text x="870" y="281" font-size="10.5" fill="#5c6a78" text-anchor="end">mmHg</text>

  <text x="70" y="307" font-size="11.5" fill="#5c6a78">Normal IAP is 5–7 mmHg in critically ill adults (Defn 4). Chronically ~9–14 mmHg in morbid obesity.</text>
  <text x="70" y="323" font-size="11.5" font-weight="600" fill="#14202b">A number alone is not ACS — grade IV IAH without organ dysfunction is still only IAH.</text>
</svg>
